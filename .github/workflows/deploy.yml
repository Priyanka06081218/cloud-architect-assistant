# .github/workflows/deploy.yml
#
# CI/CD pipeline: test → build → push to ECR → deploy to EKS
#
# Triggers:
#   - Push to main      → full pipeline (test + build + deploy)
#   - Pull request      → test only (no build, no deploy)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID, AWS_REGION, EKS_CLUSTER_NAME
#   OPENAI_API_KEY  (optional, for integration tests)

name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       ${{ secrets.AWS_REGION }}
  ECR_BACKEND:      ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-architect/backend
  ECR_FRONTEND:     ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-architect/frontend
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:

  #  Job 1: Lint + unit tests 
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt pytest

      - name: Run Python tests
        run: pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: app/frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: app/frontend

  #  Job 2: Build + push Docker images 
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    continue-on-error: true  # skips gracefully when AWS secrets are not configured

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (short SHA)
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build + push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_BACKEND }}:latest
          cache-from: type=registry,ref=${{ env.ECR_BACKEND }}:latest
          cache-to: type=inline

      - name: Build + push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.your-domain.com
          tags: |
            ${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}
            ${{ env.ECR_FRONTEND }}:latest
          cache-from: type=registry,ref=${{ env.ECR_FRONTEND }}:latest
          cache-to: type=inline

  #  Job 3: Deploy to EKS 
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    continue-on-error: true  # skips gracefully when AWS secrets are not configured
    environment: production   # adds manual approval gate in GitHub UI

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Sync secrets from SSM → Kubernetes
        run: |
          OPENAI_KEY=$(aws ssm get-parameter \
            --name /cloud-architect/openai-key \
            --with-decryption --query Parameter.Value --output text)
          REDIS_URL=$(aws ssm get-parameter \
            --name /cloud-architect/redis-url \
            --with-decryption --query Parameter.Value --output text)

          kubectl create secret generic backend-secrets \
            --from-literal=openai-api-key="$OPENAI_KEY" \
            --from-literal=redis-url="$REDIS_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Stamp image tags into manifests
        run: |
          TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s|YOUR_ECR_URL/cloud-architect/backend:latest|$ECR_BACKEND:$TAG|g" infra/k8s/deployment.yaml
          sed -i "s|YOUR_ECR_URL/cloud-architect/frontend:latest|$ECR_FRONTEND:$TAG|g" infra/k8s/deployment.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f infra/k8s/deployment.yaml
          kubectl apply -f infra/k8s/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend  --timeout=300s
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Smoke test
        run: |
          sleep 20
          LB=$(kubectl get ingress cloud-architect-ingress \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "http://$LB/health" || (echo "Smoke test failed"; exit 1)
          echo "Live at: http://$LB"

      - name: Auto-rollback on failure
        if: failure()
        run: |
          echo "Deploy failed — rolling back"
          kubectl rollout undo deployment/backend
          kubectl rollout undo deployment/frontend
